name: Private backups and maintenance
run-name: ${{ inputs.alert_drill && 'Backup notification drill' || 'Private backups and maintenance' }}
on:
  workflow_dispatch:
    inputs:
      alert_drill:
        type: boolean
        description: Simulate a failed backup without accessing production data
        default: false
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ inputs.alert_drill && 'private-operations-drill' || 'private-operations' }}
  cancel-in-progress: false
jobs:
  maintain:
    if: github.event_name == 'workflow_dispatch' || vars.OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Simulate failed backup for the notification drill
        if: inputs.alert_drill
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Back up, restore-check, and maintain
        run: node scripts/operations.mjs
        env:
          STORAGE_MODE: remote
          SEED_DEMO: 'false'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          BACKUP_RETENTION_DAYS: '14'
# Enable only after a manual successful run with dedicated repository secrets.
# Operator alerts watches unsuccessful completions on main.
