<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#226457" />
    <title>Reconnect — Lost &amp; Found</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #fbfaf6; color: #203d38; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      .brand { font-weight: 700; color: #226457; letter-spacing: -.04em; font-size: 1.3rem; }
      h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 1.1; letter-spacing: -.05em; }
      p { line-height: 1.65; }
      a { display: inline-block; margin-top: 1rem; background: #226457; color: white; border-radius: 2rem; padding: .9rem 1.5rem; text-decoration: none; font-weight: 650; }
      a:focus-visible { outline: 3px solid #e18b70; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { background: #142823; color: #fbfaf6; } .brand { color: #a3d6bd; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">lost &amp; found.</p>
      <h1>A little connection goes a long way.</h1>
      <p>Check your internet connection, then try again. Reports, photos and messages need a connection to load.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
